name: Probe EOD Availability (OI boundary measurement)

# ─────────────────────────────────────────────────────────────
# 【位置づけ】PC_GOVERNANCE 誤判断36 対応・診断専用ワークフロー
# 【期間限定運用】最低 5 営業日分のサンプルが溜まったら、この workflow
#   自体（本ファイル）を削除するか schedule トリガーだけ外すこと。
#   恒久的な第二の定期ジョブとしてリポジトリに残すのは、このプロジェクトの
#   方針（probe/tools は CI 非実行・使い捨て診断、PC_GOVERNANCE 誤判断29系）
#   に反する。四半期に1回など再検証が必要になった時だけ workflow_dispatch
#   で手動起動すれば十分。
#
# 【自動化について（schedule 採用の是非）】
# schedule トリガーで自動化する。ただし GitHub Actions の cron は
# 最大 13 時間規模でジッターしうることが実測済み（PC_PIPELINE §1.5、
# update_gex.yml 内コメント参照）。本ワークフローの対象時間帯
# (UTC 10:00-13:25 = ET 06:00-09:25 夏時間) は production が踏んだ
# 混雑帯 (UTC 22:00-00:30) とは異なるため同規模のジッターは起きにくいと
# 推測されるが、断定はできない。そのため、実行開始が遅れて観測の
# 立ち上がりを取り逃した場合に備え、tools/probe_eod_availability.py 側で
# 「初回ポーリングから既に非ゼロ行」を検出した際に警告ノートを記録する
# ようにしてある（左側打ち切りの明示。閾値のごまかしではなく、
# 観測の限界を隠さず記録する設計）。分析時は必ずこのフラグを確認すること。
#
# 【DST に関する注意】
# cron 時刻 09:45 UTC は「ET 05:45 (夏時間 EDT, UTC-4)」を意図している。
# 冬時間 (EST, UTC-5) になると同じ UTC 時刻は ET 04:45 相当にズレる
# (30分早すぎても実害はないが、確認はすること)。本診断は短期の測定
# フェーズで終える想定のため、このワークフローが冬時間を跨いで残る
# 場合は cron 値を再確認すること。
#
# 【Theta Terminal 起動手順について】
# 以下の起動〜ヘルスチェックのブロックは update_gex.yml (production) から
# そのまま踏襲している。ヘルスチェックの日付/満期は、production と同様に
# 固定値（十分に古く backfill 範囲内で確実に取引日であることを確認済みの
# ペア）を使う。
#
# ※ 当初「実行日のN日前を動的計算する」方式を採用したが、これは
#   「固定の過去日は時間経過で陳腐化する」という誤った懸念に基づくもので、
#   かつ市場カレンダー（土日祝）を考慮しない bash date 演算だったため、
#   2026-07-06 の実行で実際にヘルスチェックが失敗した（30日前が偶然
#   土曜日に当たり、常に 472=NO_DATA を返し続けた）。history API に
#   とって過去の確定日は未来がどれだけ進んでも変わらない固定点であり、
#   固定日付自体は陳腐化しない（production の固定満期 2026-06-18 が
#   満期経過後も問題なく動作し続けていることで実証済み）。この誤解に
#   基づく「動的化」は撤回し、production と同じ固定値方式に戻した。

on:
  schedule:
    - cron: '45 9 * * 1-5'   # UTC 09:45 = ET 05:45 (EDT, 夏時間)
  workflow_dispatch: {}

permissions:
  contents: read   # gex_history.json 等への書き込みはしない（読み取りのみで十分）

jobs:
  probe:
    runs-on: ubuntu-latest
    # ET 05:45-09:25 (3時間40分) + Terminal起動・セットアップの余裕
    timeout-minutes: 260
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install httpx

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # ───── Theta Terminal セットアップ（update_gex.yml から踏襲） ─────
      - name: Download Theta Terminal v3 jar (from official URL)
        run: |
          curl -L -o ThetaTerminalv3.jar https://download-unstable.thetadata.us/ThetaTerminalv3.jar
          ls -lh ThetaTerminalv3.jar

      - name: Configure creds.txt
        run: |
          printf '%s\n' "${{ secrets.THETA_CREDS }}" > creds.txt
          wc -l creds.txt

      - name: Start Theta Terminal in background
        run: |
          nohup java -jar ThetaTerminalv3.jar --creds-file creds.txt > theta_terminal.log 2>&1 &
          echo "Started Theta Terminal with PID $!"
          echo "$!" > theta_terminal.pid

      - name: Wait for Theta Terminal health check
        # update_gex.yml と同じ「本番が実際に叩くエンドポイントで
        # 疎通確認する」原則（誤判断16）を踏襲。
        #
        # ⚠️ 2026-07-06 運用インシデントを受けた修正:
        #   当初「実行日の30日前」を動的計算する方式にしていたが、
        #   これは市場カレンダーを一切考慮しない bash の date 演算で、
        #   30日前が土日祝に当たると常に 472(NO_DATA) を返し続け、
        #   ヘルスチェックが60秒でタイムアウトして失敗した
        #   （2026-07-06 の実行で実際に発生。30日前=2026-06-06=土曜）。
        #
        #   そもそも「固定の過去日付は時間経過で陳腐化する」という
        #   当初の懸念自体が誤りだった。history API にとって過去の
        #   確定した1日は未来がどれだけ進んでも変わらない固定点であり、
        #   陳腐化しない。production の update_gex.yml が固定日付・
        #   固定満期(expiration=2026-06-18, date=20260512)を使い続けて
        #   何の問題も起きていない（gex_history.json 07/01〜07/06で
        #   満期後も正常動作を確認済み）のは、まさにこの理由による。
        #
        #   よって「動的化」自体を撤回し、production と同じ設計思想
        #   （固定の過去日 + 固定の満期、十分に古く backfill 範囲内で
        #    確実に取引日であることを事前に人間が確認したペア）に戻す。
        #   bash に曜日/祝日判定を継ぎ足すことはしない
        #   （calendar/on_date という正解を持つ公式APIがあるのに、
        #    それを呼ばず簡易版を自前実装してエッジケースの穴を踏む、
        #    という同じ過ちを繰り返すだけのため）。
        #
        #   採用date/expiration: 2024-01-03（水曜、NYSE通常取引日、
        #   backfill floor 2017-01-03 より十分新しく安定）/
        #   expiration=2024-01-19（同年1月の通常満期、2024-01-03時点で
        #   既に上場・取引されていたことが確実な近接満期）。
        run: |
          set +e
          HEALTHCHECK_URL="http://127.0.0.1:25503/v3/option/history/greeks/eod?symbol=SPY&expiration=2024-01-19&start_date=20240103&end_date=20240103&format=csv"
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTHCHECK_URL" 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "Theta Terminal is ready (took ${i} seconds)"
              exit 0
            fi
            echo "Attempt ${i}/60: HTTP $status, waiting..."
            sleep 1
          done
          echo "❌ Theta Terminal did not become ready within 60 seconds"
          echo "── theta_terminal.log (last 50 lines) ──"
          tail -50 theta_terminal.log || true
          exit 1

      - name: Show Theta Terminal startup log (for confirmation)
        run: |
          echo "── theta_terminal.log (head 30 lines) ──"
          head -30 theta_terminal.log

      # ───── probe 本体 ─────
      - name: Run OI availability probe
        id: probe
        env:
          PYTHONUNBUFFERED: "1"
        # rc=0(成功)・rc=1(未収束、想定内)は step 成功のまま進める。
        # rc=2(予期しない例外・実装バグ)だけを本物の失敗として扱う
        # （2026-07-08: continue-on-error が両者を区別できず、
        #   calendar/on_date のクラッシュを「成功」に見せていたインシデントの是正）。
        run: |
          set +e
          python tools/probe_eod_availability.py \
            --symbol SPY \
            --output-dir probe_results
          rc=$?
          echo "probe exited with code ${rc}"
          if [ "$rc" = "2" ]; then
            echo "::error::probe が異常終了(rc=2)。想定内の「未収束」ではなく実装のバグの可能性が高い。ログを確認すること。"
            exit 1
          fi
          exit 0

      - name: Upload probe results (metadata only, no subscription data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oi-boundary-probe-${{ github.run_id }}
          path: probe_results/
          retention-days: 90

      - name: Stop Theta Terminal
        if: always()
        run: |
          if [ -f theta_terminal.pid ]; then
            pid=$(cat theta_terminal.pid)
            kill "$pid" 2>/dev/null || true
            echo "Stopped Theta Terminal (PID $pid)"
          fi
