name: Update GEX History

# ─────────────────────────────────────────────────────────────
# 段階 6D (v17.4): cron 時刻の高負荷帯回避調整
# ─────────────────────────────────────────────────────────────
# 段階 6D で変更したもの (v17.3 → v17.4):
#   - cron 時刻を UTC 22:30 → UTC 21:47 に変更
#
# 変更理由 (運用観察に基づく):
#   v17.3 で設定した UTC 22:30 は GitHub Actions の混雑帯
#   (UTC 22:00〜00:30、世界中の cron が UTC 00:00 周辺に集中) に
#   位置していたため、3 営業日連続で約 10 時間のキュー滞留が
#   発生していた (Run #36/#37/#38 で UTC 08:12〜09:34 実発火を観測)。
#
#   公式コミュニティの言明:
#     "Schedules that run during periods of high load
#      (e.g., midnight UTC) may be delayed or, if load is
#      sufficiently high, potentially dropped."
#
#   設計上の取得可能窓 (前営業日 EOD を取れる時間帯) は
#   UTC 20:00 (ET 16:00 取引終了) 〜 翌 UTC 04:00
#   (ET 00:00 ThetaData snapshot キャッシュリセット) まで。
#   この窓内で混雑帯を避けた時刻として UTC 21:47 を選定。
#
#   分を 47 にしたのは「キリの良い数字 (0/15/30/45) は
#   他のジョブと衝突しやすい」という GitHub Actions コミュニティの
#   定石に従ったもの。
#
# 段階 6D 完了判定 (v17.3 から継続):
#   2 営業日連続成功 (曜日依存・夜間ジョブの安定性確認)
#
# 段階 6C 初回実行で発覚した問題と修正履歴 (v17.1 / v17.2):
#   v17.1: --creds-file creds.txt を引数に明示
#   v17.2: jar URL を v3 用に変更、ヘルスチェックを本番エンドポイントに変更
#
# ─────────────────────────────────────────────────────────────

on:
  # ── 段階 6D で時刻調整 (v17.4) ──
  schedule:
    - cron: '47 21 * * 1-5'   # UTC 21:47 (ET 17:47 EDT / 18:47 EST)
  workflow_dispatch:           # 手動実行も引き続き可能

permissions:
  contents: write              # gex_history.json を commit & push するため

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ───── 環境構築 ─────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Verify Java version
        run: java -version

      # ───── Theta Terminal セットアップ ─────
      - name: Download Theta Terminal v3 jar (from official URL)
        # 公式ドキュメント (https://docs.thetadata.us/Articles/Getting-Started/Getting-Started.html)
        # が指す v3 専用 URL を使用。
        #
        # ⚠️ 注意: download-latest.thetadata.us は v2 系列 (v1.8.6) を返すため
        #         使えない。v3 用の URL は別系統 (download-unstable.thetadata.us)。
        #         「unstable」という名称だが、公式ドキュメントが指している
        #         現時点の v3 公式 DL URL である。
        run: |
          curl -L -o ThetaTerminalv3.jar https://download-unstable.thetadata.us/ThetaTerminalv3.jar
          ls -lh ThetaTerminalv3.jar

      - name: Configure creds.txt
        # secrets.THETA_CREDS には改行区切りで
        #   1 行目: メールアドレス
        #   2 行目: パスワード
        # を登録しておく前提
        run: |
          printf '%s\n' "${{ secrets.THETA_CREDS }}" > creds.txt
          # creds.txt の中身は出力しない（パスワード保護）
          # 行数のみ確認
          wc -l creds.txt

      - name: Start Theta Terminal in background
        # nohup でバックグラウンド起動、ログは theta_terminal.log に書き出す
        # 起動失敗時のデバッグのため、ログは後段で必ず確認する
        #
        # ★ v17.1 修正 (2026-05-10):
        #   --creds-file creds.txt を明示的に指定する。
        #   公式の起動仕様では「同じディレクトリに creds.txt を置く」だけでは
        #   自動認識されず、引数で明示する必要がある。
        #   段階 6C 初回実行時に "No line found" エラーで起動失敗したため、
        #   公式 usage に従って明示指定する形に修正。
        run: |
          nohup java -jar ThetaTerminalv3.jar --creds-file creds.txt > theta_terminal.log 2>&1 &
          echo "Started Theta Terminal with PID $!"
          echo "$!" > theta_terminal.pid

      - name: Wait for Theta Terminal health check
        # 最大 60 秒、1 秒ごとに本番エンドポイントを叩いて 200 を待つ。
        #
        # ⚠️ v17.2 修正 (2026-05-10):
        #   旧 yml では /v3/stock/list/symbols（Stock: FREE で叩ける軽量
        #   エンドポイント）を使っていたが、これが偽陽性の原因だった。
        #   段階 6B-2 で v2 jar が偶然 stock 系のヘルスチェックを通し、
        #   段階 6C で初めて Option 系の REST API が叩けないと判明した。
        #
        #   修正: 本番で実際に使う /v3/option/snapshot/open_interest を
        #   ヘルスチェックでも叩く。strike_range=1 で 1 ストライクだけに
        #   絞ってリクエスト軽量化。
        #
        #   curl の -w "%{http_code}" は接続失敗時も "000" を出力するので、
        #   || echo "000" は不要（付けると "000000" の二重出力になる）。
        run: |
          set +e  # curl 失敗時に即座に exit しない
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:25503/v3/option/snapshot/open_interest?symbol=SPY&expiration=*&format=csv" 2>/dev/null)
            if [ "$status" = "200" ]; then
              echo "Theta Terminal is ready (took ${i} seconds)"
              exit 0
            fi
            echo "Attempt ${i}/60: HTTP $status, waiting..."
            sleep 1
          done
          echo "❌ Theta Terminal did not become ready within 60 seconds"
          echo "── theta_terminal.log (last 50 lines) ──"
          tail -50 theta_terminal.log || true
          exit 1

      - name: Show Theta Terminal startup log (for confirmation)
        # 起動ログを Actions ログに出力（バージョン番号や Subscription 状態を確認）
        # PROJECT_CONTEXT v16 で「実 API 環境で踏みやすい 3 つの地雷
        # (471 PERMISSION / 476 WRONG_IP / 478 多重起動)」を後から検証するため
        run: |
          echo "── theta_terminal.log (head 30 lines) ──"
          head -30 theta_terminal.log

      # ───── Python 依存と検証 ─────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest gex_engine/tests/ -q

      # ───── REST 駆動で daily run（段階 6C の本題）─────
      - name: Run daily GEX update (REST)
        # ★ 段階 6C で mock → rest に切替
        # ThetaRestAdapter が Theta Terminal (localhost:25503) 経由で
        # 実 SPY のオプションチェーンを取得し、GEX を計算する。
        # 失敗時は run_daily.py 内で sys.exit(1) → このステップが赤になる。
        env:
          GEX_DATA_SOURCE: rest
        run: python -m gex_engine.scripts.run_daily

      # ───── 結果コミット ─────
      - name: Commit gex_history.json if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gex_history.json
          git diff --quiet && git diff --staged --quiet \
            || (git commit -m "Auto-update GEX history (rest, stage 6D)" && git push)

      # ───── 後片付け (任意) ─────
      - name: Stop Theta Terminal
        # ジョブ終了時に runner ごと破棄されるので必須ではないが、
        # 明示的に停止することで「Terminal が動作していた」事実を確認できる
        if: always()
        run: |
          if [ -f theta_terminal.pid ]; then
            pid=$(cat theta_terminal.pid)
            kill "$pid" 2>/dev/null || true
            echo "Stopped Theta Terminal (PID $pid)"
          fi
